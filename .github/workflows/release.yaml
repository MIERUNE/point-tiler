name: Release
on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ${{ matrix.config.os }}
    env:
      PROJECT_NAME: ptiler
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, target: aarch64-apple-darwin, extension: ''}
          - {os: macos-15-intel, target: x86_64-apple-darwin, extension: ''}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, extension: ''}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, extension: ''}
          # - {os: ubuntu-latest, target: x86_64-unknown-linux-musl, extension: ''}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, extension: '.exe'}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Install musl tools (only for musl target)
        if: matrix.config.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # PROJ is built from source on Windows; see coordinate-transformer/Cargo.toml.
      - name: Install sqlite3 (Windows)
        if: runner.os == 'Windows'
        run: choco install sqlite --no-progress

      - name: Build
        run: cargo build --profile release-lto --package app --target ${{ matrix.config.target }}

      - name: Rename artifact
        run: |
          ls -lh ./target/${{ matrix.config.target }}/release-lto/ptiler${{ matrix.config.extension }}
          mv ./target/${{ matrix.config.target }}/release-lto/ptiler${{ matrix.config.extension }} \
             ./target/${{ matrix.config.target }}/release-lto/${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.config.target }}${{ matrix.config.extension }}
        shell: bash

      - name: Upload artifact to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/${{ matrix.config.target }}/release-lto/${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.config.target }}${{ matrix.config.extension }}
          asset_name: ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.config.target }}${{ matrix.config.extension }}
          asset_content_type: application/octet-stream
