[workspace]
members = [
    "app",
    "pcd-core",
    "pcd-parser",
    "pcd-exporter",
    "cesiumtiles-gltf",
    "coordinate-transformer",
]
resolver = "3"

[workspace.package]
version = "0.0.10"
authors = ["MIERUNE Inc. <info@mierune.co.jp>"]
edition = "2024"

[workspace.dependencies]
# TODO: switch to the crates.io release that includes georust/proj#270 (3D `Coord`), which is
# not in 0.32.0.
proj = { git = "https://github.com/georust/proj", rev = "49fbffb81260baf9f6c489fe1f7ba29c6c7ba8ee", default-features = false }

[profile.dev.package."*"]
opt-level = 3

[profile.release-lto]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
